<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiniMax H3 Studio</title>
<style>
  :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#10131a; color:#edf2ff; }
  body { margin:0; padding:20px; }
  main { max-width:1280px; margin:0 auto; display:grid; grid-template-columns: 380px 1fr; gap:18px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:#171c28; border:1px solid #2a3346; border-radius:12px; padding:16px; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:15px; margin:0 0 10px; color:#c9d4ea; }
  label { display:block; margin-top:10px; font-size:13px; color:#a9b4c7; }
  input, textarea, select, button { width:100%; box-sizing:border-box; border-radius:8px; border:1px solid #3b4660; padding:9px; background:#0f1420; color:#edf2ff; font:inherit; }
  textarea { min-height:120px; resize:vertical; }
  button { margin-top:12px; background:#4f7cff; border:0; cursor:pointer; font-weight:650; }
  button.secondary { background:#2a3346; } button:disabled { opacity:.5; cursor:not-allowed; }
  a { color:#8ab4ff; }
  .muted { color:#8d99b0; font-size:12px; }
  .pool { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:8px; }
  .worker { border:1px solid #2a3346; border-radius:8px; padding:8px; font-size:12px; }
  .worker .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:#ff9e9e; }
  .worker.ok .dot { background:#8ef0b5; } .worker.busy .dot { background:#ffd479; }
  .run { border:1px solid #2a3346; border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .run header { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; }
  .status { padding:2px 8px; border-radius:999px; font-size:11px; font-weight:650; background:#2a3346; }
  .status.running { background:#2b4a8a; } .status.completed { background:#1f5a3a; } .status.failed, .status.cancelled { background:#6b2b2b; } .status.pending, .status.queued, .status.submitting { background:#5a4a1f; }
  progress { width:100%; height:8px; margin-top:6px; }
  .run .prompt { font-size:12px; color:#a9b4c7; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .run video { width:100%; margin-top:8px; border-radius:8px; background:#000; }
  .run .actions { margin-top:6px; display:flex; gap:8px; } .run .actions button { width:auto; margin:0; padding:5px 10px; font-size:12px; }
  .bar { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
</style>
</head>
<body>
<main>
  <div>
    <section>
      <h1>MiniMax H3 Studio</h1>
      <p class="muted">Guided Mode 把任务分配到空闲 GPU worker。高级编辑请打开 <a id="canvasLink" href="/canvas/" target="_blank">ComfyUI 画布</a>（直接在画布里排队的任务只在那一张卡上运行，不经过调度）。</p>
      <form id="runForm">
        <label>Workflow</label>
        <select name="kind" id="kind">
          <option value="t2va">T2VA — 文本 → 视频+音频</option>
          <option value="fl2va_first_frame">FL2VA — 首帧图 → 视频+音频</option>
        </select>
        <label>Generation Profile</label>
        <select name="profile" id="profileSelect"></select>
        <p class="muted" id="profileNote"></p>
        <label>Prompt</label>
        <textarea name="prompt">A five-second cinematic 16:9 shot of a small paper boat gliding through a rain-lit city gutter at night. Reflections ripple across the water, a distant train passes, and the ambient rain and wheel noise stay synchronized with the movement. Natural camera motion, no subtitles, no logos.</textarea>
        <label>Seed</label>
        <input name="seed" type="number" value="42" />
        <div id="frameRow" hidden>
          <label>首帧图片（FL2VA）</label>
          <input id="firstFrame" name="first_frame" type="file" accept="image/*" />
        </div>
        <button id="submitBtn" type="submit">提交</button>
        <p class="muted" id="submitMsg"></p>
      </form>
    </section>
    <section style="margin-top:18px">
      <div class="bar"><h2>Worker Pool</h2><span class="muted" id="poolSummary"></span></div>
      <div class="pool" id="pool"></div>
      <p class="muted" id="memLine"></p>
    </section>
  </div>
  <section>
    <div class="bar"><h2>Runs</h2><span class="muted">每 3 秒刷新</span></div>
    <div id="runs"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const progress = {};   // run_id -> {value, max}
const sockets = {};    // run_id -> WebSocket
let profiles = {};

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const text = await r.text();
  let data; try { data = JSON.parse(text); } catch { data = { error: text }; }
  if (!r.ok) throw new Error(data.detail || data.reason || data.error || r.statusText);
  return data;
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function init() {
  const cfg = await api('/api/config');
  profiles = cfg.profiles;
  $('profileSelect').innerHTML = Object.entries(cfg.profiles).map(([id, p]) => `<option value="${id}" ${id === cfg.default_profile ? 'selected' : ''}>${esc(p.label || id)}</option>`).join('');
  showProfileNote();
  if (cfg.canvas_url) $('canvasLink').href = cfg.canvas_url;
  await refresh();
  setInterval(refresh, 3000);
}

function showProfileNote() { const p = profiles[$('profileSelect').value]; $('profileNote').textContent = p ? `${p.width}×${p.height}, ${p.duration_seconds}s, ${p.sigma_points} sigma points. ${p.description || ''}` : ''; }
$('profileSelect').onchange = showProfileNote;
$('kind').onchange = (ev) => { $('frameRow').hidden = ev.target.value !== 'fl2va_first_frame'; };

$('runForm').onsubmit = async (ev) => {
  ev.preventDefault();
  $('submitBtn').disabled = true; $('submitMsg').textContent = '';
  try {
    const res = await api('/api/runs', { method: 'POST', body: new FormData(ev.target) });
    $('submitMsg').textContent = `已提交 ${res.run_id}（${res.status}${res.worker ? ' → ' + res.worker.id : ''}）`;
    await refresh();
  } catch (e) { $('submitMsg').textContent = '提交失败：' + e.message; }
  finally { $('submitBtn').disabled = false; }
};

async function cancelRun(id) { try { await api('/api/runs/' + id + '/cancel', { method: 'POST' }); await refresh(); } catch (e) { alert(e.message); } }

function watch(run) {
  if (sockets[run.run_id] || !run.worker || !run.client_id) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/canvas/${run.worker}/ws?clientId=${encodeURIComponent(run.client_id)}`);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (ev) => {
    if (typeof ev.data !== 'string') return;
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'progress' && msg.data && msg.data.prompt_id === run.prompt_id) {
        progress[run.run_id] = { value: msg.data.value, max: msg.data.max };
        const bar = document.querySelector(`progress[data-run="${run.run_id}"]`);
        if (bar) { bar.value = msg.data.value; bar.max = msg.data.max; }
        const lbl = document.querySelector(`[data-steps="${run.run_id}"]`);
        if (lbl) lbl.textContent = `${msg.data.value}/${msg.data.max}`;
      }
    } catch {}
  };
  ws.onclose = () => { delete sockets[run.run_id]; };
  sockets[run.run_id] = ws;
}
function unwatch(id) { if (sockets[id]) { sockets[id].close(); delete sockets[id]; } }

async function refresh() {
  const [pool, runsDoc] = await Promise.all([api('/api/workers'), api('/api/runs')]);
  $('pool').innerHTML = pool.workers.map(w => `<div class="worker ${w.healthy ? (w.current_run ? 'busy' : 'ok') : ''}"><span class="dot"></span><b>${esc(w.id)}</b><br>GPU ${esc(w.gpu)} · :${w.port}<br>${w.healthy ? (w.current_run ? '运行 ' + esc(w.current_run) : '空闲') : '离线'}${w.gpu_stats ? `<br>${Math.round((w.gpu_stats.vram_total - w.gpu_stats.vram_free)/1048576)} / ${Math.round(w.gpu_stats.vram_total/1048576)} MiB` : ''}<br><a href="/canvas/${esc(w.id)}/" target="_blank">画布</a></div>`).join('');
  $('poolSummary').textContent = `${pool.healthy_count}/${pool.worker_count} 在线 · 并发 ${pool.active_run_count}/${pool.safe_concurrent_runs}`;
  const m = pool.host_memory || {};
  $('memLine').textContent = m.used_gib != null ? `主机内存 ${m.used_gib} / ${m.total_gib} GiB（abort ${pool.host_ram_abort_gib}，hard ${pool.host_ram_hard_gib}）${pool.memory_block_reason ? ' — ' + pool.memory_block_reason : ''}` : '主机内存状态不可用';

  const active = new Set();
  $('runs').innerHTML = runsDoc.runs.map(r => {
    const isActive = ['submitting', 'queued', 'running'].includes(r.status);
    if (isActive) { active.add(r.run_id); watch(r); }
    const p = progress[r.run_id];
    const statusText = r.status === 'pending' ? `pending · 排队第 ${r.queue_position ?? '?'} 位${r.queue_reason ? '（' + esc(r.queue_reason) + '）' : ''}` : r.status;
    return `<div class="run"><header><span><code>${esc(r.run_id)}</code> · ${esc(r.kind)} · ${esc(r.profile || '')} · seed ${esc(r.seed)}${r.worker ? ' · ' + esc(r.worker) : ''}</span><span class="status ${esc(r.status)}">${statusText}</span></header>
      <div class="prompt" title="${esc(r.prompt_preview)}">${esc(r.prompt_preview)}</div>
      ${r.status === 'running' ? `<progress data-run="${esc(r.run_id)}" value="${p ? p.value : 0}" max="${p ? p.max : 100}"></progress><span class="muted" data-steps="${esc(r.run_id)}">${p ? p.value + '/' + p.max : '等待进度…'}</span>` : ''}
      ${r.failure_reason ? `<div class="muted">${esc(r.failure_reason)}</div>` : ''}
      ${r.timing && r.timing.created_to_completed_s != null ? `<div class="muted">耗时 ${r.timing.created_to_completed_s}s</div>` : ''}
      ${r.artifacts.map(a => `<video controls preload="metadata" src="${esc(a.download_url)}"></video><div class="muted"><a href="${esc(a.download_url)}" download>${esc(a.filename)}</a></div>`).join('')}
      ${(isActive || r.status === 'pending') ? `<div class="actions"><button class="secondary" onclick="cancelRun('${esc(r.run_id)}')">取消</button></div>` : ''}
    </div>`;
  }).join('') || '<p class="muted">还没有任务。</p>';
  for (const id of Object.keys(sockets)) if (!active.has(id)) unwatch(id);
}

init().catch(e => { $('runs').innerHTML = `<p class="muted">初始化失败：${esc(e.message)}</p>`; });
</script>
</body>
</html>
